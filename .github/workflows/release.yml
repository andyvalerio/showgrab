name: Release image

# Builds and publishes the Docker image to GHCR whenever a GitHub Release is
# published. Tags the image with the release tag (e.g. v0.1.0) and `latest`.
# Argo CD Image Updater (or any registry-watching deploy tool) picks up the
# new semver tag on its own — publishing a release is the only step needed
# to ship a new version to anyone running showgrab.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository }}:latest
