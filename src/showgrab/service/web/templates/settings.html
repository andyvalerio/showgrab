{% extends "base.html" %}
{% block title %}showgrab — settings{% endblock %}
{% block content %}
<h1>Settings</h1>
<form method="post" action="/settings">

  <fieldset>
    <legend>Feed &amp; schedule</legend>
    <label for="feed_url">showRSS feed URL</label>
    <input type="text" id="feed_url" name="feed_url" value="{{ settings.feed_url }}">

    <label for="poll_interval_minutes">Poll interval (minutes)</label>
    <input type="number" step="1" min="1" id="poll_interval_minutes" name="poll_interval_minutes" value="{{ settings.poll_interval_minutes }}">

    <label><input type="checkbox" name="dry_run" {% if settings.dry_run %}checked{% endif %}> Dry run (never downloads; emails what it would do)</label>
  </fieldset>

  <fieldset>
    <legend>Quality &amp; timing</legend>
    <label for="preferred_quality">Preferred quality</label>
    <select id="preferred_quality" name="preferred_quality">
      {% for q in ["SD", "720p", "1080p", "2160p"] %}
      <option value="{{ q }}" {% if settings.preferred_quality == q %}selected{% endif %}>{{ q }}</option>
      {% endfor %}
    </select>

    <label for="wait_hours">Wait for preferred quality (hours) before grabbing the closest available</label>
    <input type="number" step="0.5" min="0" id="wait_hours" name="wait_hours" value="{{ settings.wait_hours }}">

    <label for="swap_window_days">Swap window after a grab (days)</label>
    <input type="number" step="0.5" min="0" id="swap_window_days" name="swap_window_days" value="{{ settings.swap_window_days }}">

    <label for="old_cutoff_days">Skip episodes older than (days)</label>
    <input type="number" step="1" min="0" id="old_cutoff_days" name="old_cutoff_days" value="{{ settings.old_cutoff_days }}">
  </fieldset>

  <fieldset>
    <legend>qBittorrent</legend>
    <div id="qbt-fields">
      <label for="qbittorrent_url">URL</label>
      <input type="text" id="qbittorrent_url" name="qbittorrent_url" value="{{ settings.qbittorrent_url }}">
      <label for="qbittorrent_username">Username</label>
      <input type="text" id="qbittorrent_username" name="qbittorrent_username" value="{{ settings.qbittorrent_username }}">
      <label for="qbittorrent_password">Password</label>
      <input type="password" id="qbittorrent_password" name="qbittorrent_password" value="{{ settings.qbittorrent_password }}">
      <label for="qbittorrent_category">Category (optional)</label>
      <input type="text" id="qbittorrent_category" name="qbittorrent_category" value="{{ settings.qbittorrent_category or '' }}">
    </div>
    <div class="row" style="margin-top:0.6rem">
      <button type="button" class="secondary"
        hx-post="/settings/test/qbittorrent" hx-include="#qbt-fields"
        hx-target="#qbt-test-result" hx-swap="innerHTML">Test connection</button>
      <span id="qbt-test-result" class="test-result"></span>
    </div>
  </fieldset>

  <fieldset>
    <legend>Jellyfin</legend>
    <div id="jellyfin-fields">
      <label for="jellyfin_url">URL</label>
      <input type="text" id="jellyfin_url" name="jellyfin_url" value="{{ settings.jellyfin_url }}">
      <label for="jellyfin_api_key">API key</label>
      <input type="password" id="jellyfin_api_key" name="jellyfin_api_key" value="{{ settings.jellyfin_api_key }}">
    </div>
    <div class="row" style="margin-top:0.6rem">
      <button type="button" class="secondary"
        hx-post="/settings/test/jellyfin" hx-include="#jellyfin-fields"
        hx-target="#jellyfin-test-result" hx-swap="innerHTML">Test connection</button>
      <span id="jellyfin-test-result" class="test-result"></span>
    </div>
  </fieldset>

  <fieldset>
    <legend>SMTP (digest email)</legend>
    <div id="smtp-fields">
      <label for="smtp_host">Host</label>
      <input type="text" id="smtp_host" name="smtp_host" value="{{ settings.smtp_host }}">
      <label for="smtp_port">Port</label>
      <input type="number" id="smtp_port" name="smtp_port" value="{{ settings.smtp_port }}">
      <label for="smtp_username">Username</label>
      <input type="text" id="smtp_username" name="smtp_username" value="{{ settings.smtp_username }}">
      <label for="smtp_password">Password</label>
      <input type="password" id="smtp_password" name="smtp_password" value="{{ settings.smtp_password }}">
      <label for="smtp_from">From address</label>
      <input type="text" id="smtp_from" name="smtp_from" value="{{ settings.smtp_from }}">
      <label for="smtp_to">To address(es), comma-separated</label>
      <input type="text" id="smtp_to" name="smtp_to" value="{{ settings.smtp_to | join(', ') }}">
      <label><input type="radio" name="smtp_tls_mode" value="starttls" {% if settings.smtp_use_tls %}checked{% endif %}> STARTTLS (e.g. port 587)</label>
      <label><input type="radio" name="smtp_tls_mode" value="ssl" {% if settings.smtp_use_ssl %}checked{% endif %}> Implicit TLS/SSL (e.g. port 465)</label>
    </div>
    <div class="row" style="margin-top:0.6rem">
      <button type="button" class="secondary"
        hx-post="/settings/test/smtp" hx-include="#smtp-fields"
        hx-target="#smtp-test-result" hx-swap="innerHTML">Test connection</button>
      <span id="smtp-test-result" class="test-result"></span>
    </div>
  </fieldset>

  <fieldset>
    <legend>Save paths</legend>
    <label for="tv_root">TV root (for brand-new series not yet in the library)</label>
    <input type="text" id="tv_root" name="tv_root" value="{{ settings.tv_root }}">

    <label for="path_mappings">Path mappings — one per line, "from -&gt; to" (media-server path -&gt; downloader path)</label>
    <textarea id="path_mappings" name="path_mappings" rows="4" style="width:100%;max-width:520px;font-family:monospace;font-size:0.85rem">{% for f, t in settings.path_mappings %}{{ f }} -> {{ t }}
{% endfor %}</textarea>
  </fieldset>

  <button type="submit">Save settings</button>
</form>
{% endblock %}
