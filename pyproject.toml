[project]
name = "showgrab"
version = "0.1.0"
description = "Watch a showRSS feed and download new TV episodes through qBittorrent at a preferred quality, converging (up or down) as releases appear."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# core/ stays stdlib-only by convention (no import of httpx etc. outside
# adapters/ and service/), so the decision engine remains trivially testable
# and portable. The web UI (phase 4) adds Jinja2/HTMX on top of fastapi.
dev = [
    "pytest>=8",
]

[project.scripts]
showgrab = "showgrab.cli:main"
showgrab-serve = "showgrab.service.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
