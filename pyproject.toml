[project]
name = "showgrab"
version = "0.1.0"
description = "Watch a showRSS feed and download new TV episodes through qBittorrent at a preferred quality, converging (up or down) as releases appear."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Phase 1 is headless and dependency-free on purpose (stdlib only), so the core
# engine stays trivially testable and portable. Adapters/UI add deps in later
# phases (httpx, fastapi, sqlalchemy, apscheduler, ...).
dev = [
    "pytest>=8",
]

[project.scripts]
showgrab = "showgrab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
