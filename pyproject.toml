[project]
name = "showgrab"
version = "0.1.0"
description = "Watch a showRSS feed and download new TV episodes through qBittorrent at a preferred quality, converging (up or down) as releases appear."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# core/ stays stdlib-only by convention (no import of httpx etc. outside
# adapters/), so the decision engine remains trivially testable and portable.
# UI/scheduler/persistence deps (fastapi, sqlalchemy, apscheduler, ...) arrive
# in later phases.
dev = [
    "pytest>=8",
]

[project.scripts]
showgrab = "showgrab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
